<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Carousel</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="container">
      <div class="images-container">
        <button id="previous" aria-label="Previous">
          <img src="assets/img/left.png" />
        </button>
        <div class="images-wrapper">
          <img src="assets/img/1.png" class="image" id="1" />
          <img src="assets/img/2.png" class="image" id="2" />
          <img src="assets/img/3.png" class="image" id="3" />
          <img src="assets/img/4.png" class="image" id="4" />
        </div>
        <button id="next" aria-label="Next">
          <img src="assets/img/right.png" class="btn-img" />
        </button>
      </div>
      <div class="image-count" id="count">1 / 4</div>
    </div>
  </body>
</html>
